# Nha thuoc An Tam - React + FastAPI trong 1 Render Web Service (Docker).
# PostgreSQL luu tren Neon (hoac dich vu PostgreSQL ben ngoai), KHONG tao Render Postgres Free.
services:
  - type: web
    name: an-tam-gemini
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-2.5-flash-lite
      - key: GEMINI_RETRY_ATTEMPTS
        value: "1"
      - key: GEMINI_RETRY_BASE_SECONDS
        value: "0.8"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
